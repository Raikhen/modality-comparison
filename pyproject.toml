[project]
name = "modality-comparison"
version = "0.1.0"
description = "Evaluate LLM guardrail robustness across plain-text vs. agentic modalities"
requires-python = ">=3.11"
dependencies = [
    "inspect-ai>=0.3.0",
    "openai>=1.30.0",
    "anthropic>=0.30.0",
    "google-genai>=1.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
